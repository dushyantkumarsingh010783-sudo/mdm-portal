<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        SMART FORM ENTERPRISE v5.0
    </title>


    <link rel="stylesheet" href="style.css">


</head>


<body>


<main id="loginPage">


    <div class="login-card">


        <img 
            src="logo.png"
            class="login-logo"
            alt="SMART FORM LOGO"
        >


        <h1 class="login-title">

            SMART FORM

        </h1>


        <p class="login-subtitle">

            ENTERPRISE v5.0

        </p>



        <div class="form-group">


            <label>
                User ID
            </label>


            <input

                type="text"

                id="userId"

                class="form-control"

                placeholder="Enter User ID"

                autocomplete="username"

            >


        </div>




        <div class="form-group">


            <label>
                Password
            </label>


            <input

                type="password"

                id="password"

                class="form-control"

                placeholder="Enter Password"

                autocomplete="current-password"

            >


        </div>




        <button

            id="loginBtn"

            class="btn-login">


            LOGIN


        </button>



    </div>



</main>




<!-- Configuration -->

<script src="config.js"></script>


<!-- Login Controller -->

<script src="script.js"></script>



</body>


</html>
