<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMART MDM PORTAL</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="header">

<h1>🍛 SMART MDM PORTAL</h1>

<p>PM POSHAN Monitoring System</p>

</div>

<form id="mdmForm">

<div class="form-group">

<label>न्याय पंचायत</label>

<select id="nyay" required>

<option value="">-- चयन करें --</option>

</select>

</div>

<div class="form-group">

<label>विद्यालय का प्रकार</label>

<select id="type" required>

<option value="">-- चयन करें --</option>

<option>प्राथमिक</option>

<option>उच्च प्राथमिक</option>

<option>कम्पोजिट</option>

</select>

</div>

<div class="form-group">

<label>विद्यालय का नाम</label>

<select id="school" required>

<option value="">-- पहले चयन करें --</option>

</select>

</div>

<div class="form-group">

<label>प्रधानाध्यापक का नाम</label>

<input
type="text"
id="hm"
placeholder="प्रधानाध्यापक का नाम"
required>

</div>

<div class="form-group">

<label>मोबाइल नम्बर</label>

<input
type="tel"
id="mobile"
maxlength="10"
placeholder="10 अंकों का मोबाइल नम्बर"
required>

</div>

<button type="submit">

डेटा सुरक्षित करें

</button>

</form>

<div id="message"></div>

</div>

<script src="script.js"></script>

</body>
</html>
