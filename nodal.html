<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
SMART FORM ENTERPRISE
Nodal Dashboard
</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="dashboard-container">

<header class="dashboard-header">

<div>

<h1>

SMART FORM ENTERPRISE

</h1>

<p>

NODAL DASHBOARD v5.0

</p>

</div>

<button

id="logoutBtn"

class="btn-logout">

LOGOUT

</button>

</header>



<section class="user-card">

<h2>

Welcome Nodal Officer

</h2>

<div id="userInfo">

Loading Profile...

</div>

</section>



<section class="dashboard-grid">

<div class="dashboard-card">

<h3>

Assigned Schools

</h3>

<div id="assignedSchools">

0

</div>

</div>



<div class="dashboard-card">

<h3>

Submitted Responses

</h3>

<div id="submittedResponses">

0

</div>

</div>



<div class="dashboard-card">

<h3>

Pending Schools

</h3>

<div id="pendingSchools">

0

</div>

</div>



<div class="dashboard-card">

<h3>

Progress

</h3>

<div id="progressPercent">

0%

</div>

</div>
<!--=====================================================
 SEARCH PANEL
======================================================-->

<section class="search-panel">

    <div class="search-box">

        <input
            type="text"
            id="searchSchool"
            placeholder="Search School / UDISE">

        <button
            id="searchBtn"
            class="btn-primary">

            SEARCH

        </button>

        <button
            id="refreshBtn"
            class="btn-secondary">

            REFRESH

        </button>

    </div>

</section>


<!--=====================================================
 ACTION PANEL
======================================================-->

<section class="action-panel">

    <button
        id="newEntryBtn"
        class="btn-success">

        ➕ New Entry

    </button>

</section>


<!--=====================================================
 SCHOOL LIST
======================================================-->

<section class="table-section">

<table
id="schoolTable"
class="data-table">

<thead>

<tr>

<th>

S.No.

</th>

<th>

School Name

</th>

<th>

UDISE

</th>

<th>

Status

</th>

<th>

Action

</th>

</tr>

</thead>

<tbody
id="schoolTableBody">

<tr>

<td colspan="5">

Loading Schools...

</td>

</tr>

</tbody>

</table>

</section>


<!--=====================================================
 PAGINATION
======================================================-->

<section class="pagination-panel">

<button
id="prevPage">

Previous

</button>

<span
id="pageInfo">

Page 1

</span>

<button
id="nextPage">

Next

</button>

</section>
</section>
